# Sinterklaas-escaperoom op je homelab
# Start:  docker compose up -d      → open http://<homelab-ip>:8080
# Stop:   docker compose down
services:
  sint-escaperoom:
    image: nginx:alpine
    container_name: sint-escaperoom
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./game.js:/usr/share/nginx/html/game.js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
