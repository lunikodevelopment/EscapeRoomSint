# Sinterklaas-escaperoom op je homelab
# Start:  docker compose up -d      → open http://<homelab-ip>:8080
# Alleen dit bestand nodig; de image komt van ghcr.io.
# (Is het package privé? Eerst: docker login ghcr.io, of zet het package op public.)
services:
  sint-escaperoom:
    image: ghcr.io/lunikodevelopment/escaperoomsint:latest
    container_name: sint-escaperoom
    restart: unless-stopped
    ports:
      - "8080:80"
